# -----------------------------------------------------------------------
# We don't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (docker/.env) with your own
# unique random secure passwords and SECRET_KEY.
#
# For verbose logging during development:
# - Set SUPERSET_LOG_LEVEL=debug in docker/.env-local for detailed Superset logs
# -----------------------------------------------------------------------
x-superset-image: &superset-image apachesuperset.docker.scarf.sh/apache/superset:${TAG:-latest-dev}
x-superset-volumes:
  &superset-volumes # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - ./superset-core:/app/superset-core
  - superset_home:/app/superset_home

services:
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    # volatile-lru only evicts keys with a TTL (all cache entries), never
    # Celery's broker/result keys, which generally have none.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 384m
    volumes:
      - redis:/data

  db:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false

    image: postgres:17
    container_name: superset_db
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  superset:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
      - path: .env # deploy tool writes this; overrides the defaults
        required: false
    image: *superset-image
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    ports:
      - 8088:8088
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes

  superset-init:
    image: *superset-image
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
      - path: .env # deploy tool writes this; overrides the defaults
        required: false
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true

  superset-worker:
    image: *superset-image
    container_name: superset_worker
    # This image ships no browser at all, but alert/report screenshots need
    # one (WEBDRIVER_TYPE=chrome in superset_config.py) - install it on
    # every start rather than maintaining a custom image build.
    command:
      [
        "sh",
        "-c",
        "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends chromium && exec /app/docker/docker-bootstrap.sh worker",
      ]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
      - path: .env # deploy tool writes this; overrides the defaults
        required: false
    restart: unless-stopped
    # Docker's 64MB default shared memory isn't enough for the headless
    # browser that renders alert/report screenshots - it crashes with
    # "Process unexpectedly closed with status 255" without this.
    shm_size: 2gb
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]

  superset-worker-beat:
    image: *superset-image
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
      - path: .env # deploy tool writes this; overrides the defaults
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true

  # Internal-only: no per-caller identity (MCP_DEV_USERNAME acts as one
  # fixed service user for every call), so this must stay off the public
  # internet - reachable only over VPN. See docker/pythonpath_dev/
  # superset_config.py for the MCP_DEV_USERNAME wiring this needs, and
  # PRODUCTION.md/SECURITY.md in superset/mcp_service/ for the JWT-based
  # upgrade path if that ever stops being enough.
  superset-mcp:
    image: *superset-image
    container_name: superset_mcp
    user: "root"
    command: ["/app/docker/docker-bootstrap.sh", "mcp"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
      - path: .env # deploy tool writes this; overrides the defaults
        required: false
    environment:
      MCP_PORT: "5008"
      # Fixed service identity for every MCP call - not a real person, not
      # Admin. Create this user with a restricted role (Scope_Gold_Full +
      # Creator_Capability, see AUTH_ROLES_MAPPING above) via the Superset
      # UI; no MCP tool manages users/roles.
      MCP_DEV_USERNAME: mcp_service
      # Container-to-container address for MCP's own calls back into the
      # web app (e.g. screenshot rendering) - internal, not the public
      # https://superset.bloomwell.de/ domain.
      SUPERSET_WEBSERVER_ADDRESS: http://superset:8088
    ports:
      - 5008:5008
    depends_on:
      superset-init:
        condition: service_completed_successfully
    # Overrides the image's baked-in healthcheck, which always curls the
    # main webserver's port (8088) regardless of which process the
    # container runs - this one only runs the MCP process on 5008. A plain
    # TCP check is used because FastMCP's /mcp endpoint requires POST with
    # specific Accept headers to return 200 (a plain GET is 405).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5008'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes: *superset-volumes

volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
